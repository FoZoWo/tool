<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8e4d1">
<title>FoZoWo LP Player — Brown Edition</title>
<style>
:root{color-scheme:light;--paper:#e8e4d1;--ink:#34251b;--wood:#6f472d;--wood-dark:#2b1a12;--brass:#cba36a;--cream:#f2e5c9;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--paper);color:var(--ink)}
body{min-height:100vh;min-height:100dvh;overflow:auto}
button,input{font:inherit}button{touch-action:manipulation}
.player{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:clamp(8px,2vw,22px);overflow:hidden;background:radial-gradient(ellipse at 48% 38%,#f5f0de 0,#e8e4d1 58%,#d2c8ad 100%);isolation:isolate}
.player:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.19;background:repeating-linear-gradient(0deg,#5c4b3008 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,#5c4b3008 0 1px,transparent 1px 5px);z-index:0}
.machine-shell{position:relative;z-index:1;width:min(100%,calc((100dvh - 34px)*1.28),1160px);padding:12px;border-radius:28px;border:2px solid #3c2416;background:linear-gradient(132deg,#cba878 0%,#8e633f 13%,#734a2c 32%,#57351f 56%,#986b43 78%,#432719 100%);box-shadow:0 22px 50px #3f291b38,inset 0 1px 0 #f4d9ad,inset 0 -5px 10px #26150d8a}
.machine-shell:before{content:"";position:absolute;inset:5px;border:1px solid #e8c69299;border-radius:21px;pointer-events:none;box-shadow:inset 0 0 0 1px #3b241b90}
.machine-shell:after{content:"";position:absolute;inset:11px;border-radius:15px;border:1px solid #3e271a80;pointer-events:none}
.deck-header{position:relative;z-index:2;display:flex;align-items:center;gap:clamp(10px,2vw,22px);min-height:62px;padding:4px 10px 12px;border-bottom:1px solid #f2d5a357;box-shadow:0 1px 0 #2b190d75}
.brand-logo{position:static;display:block;flex:0 0 auto;width:clamp(112px,14vw,178px);height:auto;aspect-ratio:2000/620;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 2px 3px #26170f70)}
.header-brand{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px;color:#f5e3c4;text-shadow:0 2px 2px #29180e}
.brand-kicker{font:800 9px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.24em;color:#e0bd88}
.brand-title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(15px,2vw,23px);font-weight:700;letter-spacing:.08em;line-height:1.05}
.brand-subtitle{font-size:9px;letter-spacing:.14em;color:#d8bb94}
.power-badge{display:flex;align-items:center;gap:7px;padding:8px 10px;border:1px solid #d7b17c70;border-radius:7px;background:linear-gradient(#382316,#4d2d1b);color:#e7d0aa;font:800 9px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;box-shadow:inset 0 1px 2px #160c07}
.power-led{width:8px;height:8px;border-radius:50%;background:#5d3320;border:1px solid #221309;box-shadow:inset 0 1px 2px #120a06;transition:all .2s}
.power-led.on{background:#b9e98a;box-shadow:0 0 7px #b5f27c,0 0 13px #8dd36b80,inset 0 1px 1px #f4ffdf}
.deck-layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 250px;align-items:stretch;gap:13px;padding:12px 2px 2px}
.scene-wrap{position:relative;min-width:0;min-height:0;display:grid;place-items:center;overflow:hidden;border:2px solid #4a3021;border-radius:16px;background:radial-gradient(ellipse at 44% 39%,#f4edda 0,#e4dec8 66%,#c9bea1 100%);box-shadow:inset 0 2px 8px #5e452533,inset 0 0 0 4px #f3e7ca70,0 3px 6px #29180e28}
.scene-wrap:before{content:"";position:absolute;inset:7px;border-radius:10px;border:1px solid #9c8a6c66;pointer-events:none;z-index:1}
#turntableArt{display:block;width:100%;height:auto;max-height:calc(100dvh - 140px);overflow:visible;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.record-surface{stroke:#23150d;stroke-width:2;fill:url(#vinylBrown)}
.groove{fill:none;stroke:#1d110b;stroke-width:1.15;opacity:.86}
.groove-glint{fill:none;stroke:#8e6544;stroke-width:.7;opacity:.48}
.record-highlight{pointer-events:none;opacity:.7}
#tonearm{cursor:grab;touch-action:none;pointer-events:all}
#tonearm.dragging{cursor:grabbing}
.arm-hit{fill:none;stroke:transparent;stroke-width:42;stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:grab;touch-action:none}
.arm-outline{fill:none;stroke:#5a4939;stroke-width:5.2;stroke-linecap:round;stroke-linejoin:round}
.arm-light{fill:none;stroke:#e8dcc4;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.94}
.cartridge{fill:#9c8060;stroke:#4e3927;stroke-width:2}
.stylus{stroke:#332319;stroke-width:2.4;stroke-linecap:round}
.controls{position:relative;align-self:stretch;min-width:0;display:flex;flex-direction:column;gap:13px;padding:15px 13px 12px;border:2px solid #402719;border-radius:15px;background:linear-gradient(145deg,#b58b5a 0%,#8c613c 22%,#704629 54%,#4e2e1c 100%);box-shadow:inset 0 1px 0 #ffe0aa80,inset 0 -4px 7px #2b180c94,0 4px 8px #2d1a0d37}
.controls:before,.controls:after{content:"";position:absolute;top:6px;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f8e4bc,#50331f 80%);box-shadow:0 1px 1px #25140c;pointer-events:none}.controls:before{left:6px}.controls:after{right:6px}
.panel-heading{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:2px 3px 10px;border-bottom:1px solid #e8c08a70;box-shadow:0 1px 0 #2c190e70;color:#f6e5c8}
.panel-heading strong{font:800 10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em}
.panel-heading span{font:700 8px/1 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;color:#e4be8c}
.control-buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:7px;min-width:0;min-height:46px;padding:8px 9px;border:1px solid #3b2416;border-radius:7px;color:#f7e9d0;background:linear-gradient(180deg,#795136 0%,#5d3822 53%,#432616 100%);box-shadow:inset 0 1px 0 #f9dbad44,inset 0 -2px 2px #2a160d70,0 3px 2px #2e1a0f;cursor:pointer;text-shadow:0 1px 1px #29170c;font-size:11px;font-weight:850;letter-spacing:.04em;transition:filter .12s,transform .12s,box-shadow .12s}
.btn:before{content:"";position:absolute;inset:3px;border:1px solid #c99c6260;border-radius:4px;pointer-events:none}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(2px);box-shadow:inset 0 2px 4px #25140e,0 1px 1px #2e1a0f}
.btn .button-icon{font-size:15px;line-height:1}
.btn.load{grid-column:1/-1;min-height:48px;background:linear-gradient(#dbc092,#b18a55 52%,#8b6338);color:#3e2817;text-shadow:none;border-color:#634224}
.btn.play{min-height:68px;background:linear-gradient(#e4cf9c,#c5a069 55%,#92683e);color:#3b2515;text-shadow:none;border-color:#57371e;font-size:13px}
.btn.stop{min-height:68px}
.btn[aria-pressed="true"]{filter:brightness(1.2);box-shadow:inset 0 0 0 2px #e7c28b, inset 0 1px 0 #ffebc3,0 0 0 1px #302014;}
.rpm-control{grid-column:1/-1;border:1px solid #3d2415;border-radius:8px;padding:8px;background:linear-gradient(180deg,#624029,#3e2517);box-shadow:inset 0 2px 4px #231309}
.speed-caption{margin:0 0 7px;text-align:center;color:#d7b88d;font:800 8px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em}
.speed-switch{display:flex;gap:7px}
.btn.rpm{flex:1;min-height:47px;padding:4px 6px;flex-direction:column;gap:2px;border-radius:6px;background:linear-gradient(#8a6545,#5b3922);font-size:13px}
.btn.rpm small{font-size:8px;letter-spacing:.16em;color:#e2c39c}
.btn.rpm[aria-pressed="true"]{color:#342014;background:linear-gradient(#f0d9a7,#d0a66a 58%,#ae824e);box-shadow:inset 0 1px 0 #fff2cd,0 0 0 1px #2b190f}
.btn.rpm[aria-pressed="true"] small{color:#5a3920}
.track-status{margin-top:auto;min-width:0;padding:9px 8px 8px;border:1px solid #3b2315;border-radius:7px;background:linear-gradient(#432719,#2e1b11);box-shadow:inset 0 2px 4px #1b0e07;color:#dfc39b}
.track-status .track-label{display:block;margin-bottom:5px;color:#b89162;font:800 8px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em}
.track{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f5e8d0;font-size:10px;font-weight:650}
.file-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.status{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;min-height:25px;margin:3px 2px 0;padding:4px 10px;color:#e9d3b0;font:10px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center;letter-spacing:.04em;text-shadow:0 1px 1px #28170d}
.status:before{content:"●";color:#c69b62;font-size:8px}
@media(max-width:690px){
 body{overflow:auto}.player{display:block;padding:8px 6px max(8px,env(safe-area-inset-bottom));}
 .machine-shell{width:100%;padding:8px;border-radius:20px}
 .machine-shell:before{inset:4px;border-radius:15px}.machine-shell:after{inset:8px;border-radius:11px}
 .deck-header{min-height:48px;padding:4px 5px 8px;gap:9px}
 .brand-logo{width:clamp(92px,27vw,130px)}.brand-kicker{font-size:7px;letter-spacing:.14em}.brand-title{font-size:15px}.brand-subtitle{font-size:7px;letter-spacing:.06em}
 .power-badge{padding:7px 6px;font-size:8px;gap:5px}.power-led{width:7px;height:7px}
 .deck-layout{grid-template-columns:minmax(0,1fr);gap:8px;padding:8px 1px 1px}
 .scene-wrap{width:min(100%,calc((100dvh - 285px)*1.034),510px);justify-self:center;border-radius:12px}
 #turntableArt{width:100%;max-height:none}
 .controls{width:100%;padding:12px 10px 10px;gap:9px;border-radius:12px}
 .panel-heading{padding-bottom:7px}.panel-heading strong{font-size:9px}.panel-heading span{font-size:7px}
 .control-buttons{grid-template-columns:1fr 1fr 1fr;gap:7px}
 .btn.load{grid-column:1/-1;min-height:43px}.btn.play,.btn.stop{min-height:48px;font-size:11px}
 .btn.rpm{min-height:42px}.rpm-control{grid-column:1/-1}
 .track-status{margin-top:0;display:flex;align-items:center;gap:10px;padding:8px 9px}.track-status .track-label{margin:0;flex:0 0 auto}.track{min-width:0;text-align:right}
 .status{margin-top:2px;font-size:9px;min-height:23px}
}
@media(max-width:380px){.brand-logo{width:84px}.brand-title{font-size:13px}.brand-subtitle{letter-spacing:0}.deck-header{gap:6px}.power-badge{letter-spacing:.05em}.btn{padding-left:5px;padding-right:5px;font-size:10px}}
@media(max-height:520px) and (orientation:landscape){.player{padding:5px}.machine-shell{width:min(100%,calc((100dvh - 18px)*1.4),1120px);padding:7px}.deck-header{min-height:42px;padding:2px 8px 6px}.brand-logo{width:105px}.brand-title{font-size:15px}.deck-layout{padding-top:7px;gap:8px;grid-template-columns:minmax(0,1fr) 218px}.controls{padding:9px;gap:7px}.panel-heading{padding-bottom:6px}.btn{min-height:35px}.btn.play,.btn.stop{min-height:45px}.btn.load{min-height:36px}.btn.rpm{min-height:37px}.status{min-height:18px;padding:2px;font-size:8px}}
@media(prefers-reduced-motion:reduce){.btn,.power-led{transition:none}}

/* FoZoWo official links: tactile metal-and-wood console strip */
.brand-footer{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:7px 2px 0;padding:10px 7px 3px;border-top:1px solid #e8c69255;color:#e7d0aa}
.footer-operator{flex:0 0 auto;color:#e5c59a;font:800 9px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.08em;text-shadow:0 1px 1px #29180e}
.footer-right{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap;margin-left:auto}
.footer-home{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 10px;border:1px solid #d6b27c9c;border-radius:7px;background:linear-gradient(180deg,#5c3822,#3c2417);color:#f8e8ce;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.015em;box-shadow:inset 0 1px 0 #ffe8bd3b,0 2px 3px #29180e38;transition:filter .15s,transform .15s}
.footer-home:hover{filter:brightness(1.2);transform:translateY(-1px)}
.footer-home svg{width:17px;height:17px;flex:0 0 auto}
.footer-home .home-copy{display:flex;flex-direction:column;gap:2px;line-height:1.05}
.footer-home small{font-size:9px;color:#d9b888;font-weight:700}
.social-area{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.social-caption{color:#dfbf91;font:800 8px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase}
.social-caption strong{color:#ffebcc;font-size:10px;letter-spacing:.03em;margin-left:4px}
.social-icons{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:5px}
.social-icon{display:inline-grid;place-items:center;width:31px;height:31px;border:1px solid #cba36a;border-radius:50%;background:linear-gradient(145deg,#694329,#321d12);color:#f7e7ce;text-decoration:none;box-shadow:inset 0 1px 0 #ffe9c24f,0 2px 3px #29180e38;transition:transform .15s,filter .15s,background .15s}
.social-icon svg{display:block;width:16px;height:16px;fill:currentColor;overflow:visible}
.social-icon:hover{transform:translateY(-2px);filter:brightness(1.28);background:linear-gradient(145deg,#906542,#4d2b19)}
.social-icon:focus-visible,.footer-home:focus-visible{outline:2px solid #ffe0a6;outline-offset:2px}
.social-icon.linktree svg{width:18px;height:18px}
@media(max-width:690px){.brand-footer{justify-content:center;gap:8px;margin-top:6px;padding-top:8px}.footer-operator{flex:1 0 100%;text-align:center}.footer-right{width:100%;justify-content:center;gap:10px;margin:0}.social-area{align-items:center}.social-icons{justify-content:center;gap:6px}.social-icon{width:32px;height:32px}}
@media(max-width:380px){.footer-right{gap:8px}.footer-home{padding:6px 8px;font-size:9px}.social-icons{gap:4px}.social-icon{width:29px;height:29px}.social-icon svg{width:15px;height:15px}}

</style>
</head>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const svg = $('turntableArt');
  const record = $('recordSpin');
  const tonearm = $('tonearm');
  const audio = $('audio');
  const fileInput = $('fileInput');
  const loadBtn = $('loadBtn');
  const playBtn = $('playBtn');
  const stopBtn = $('stopBtn');
  const rpm33 = $('rpm33');
  const rpm45 = $('rpm45');
  const status = $('status');
  const trackName = $('trackName');
  const PIVOT = { x:651, y:201 };
  const START_TIP = { x:551, y:573 };
  const START_DIR = Math.atan2(START_TIP.y - PIVOT.y, START_TIP.x - PIVOT.x);
  const MAX_SWEEP = 23;
  const RPM45_RATE = 45 / (100 / 3);
  let rpm = 33;
  let armAngle = 0;
  let dragging = false;
  let dragPointerAngle = 0;
  let dragArmStart = 0;
  let fileUrl = '';
  let audioContext = null;
  let audioSource = null;
  let noiseGain = null;
  let noiseSource = null;
  let crackleBuffer = null;
  let crackleTimer = null;
  let rotationFrame = 0;
  let lastFrameTime = 0;
  let rotationAngle = 0;

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function applyRpm() {
    const rate = rpm === 45 ? RPM45_RATE : 1;
    audio.playbackRate = rate;
    audio.defaultPlaybackRate = rate;
    if ('preservesPitch' in audio) audio.preservesPitch = false;
    if ('webkitPreservesPitch' in audio) audio.webkitPreservesPitch = false;
    rpm33.setAttribute('aria-pressed', String(rpm === 33));
    rpm45.setAttribute('aria-pressed', String(rpm === 45));
    status.textContent = audio.src ? `${rpm === 45 ? '45 RPM' : '33⅓ RPM'} · ${audio.paused ? '停止中' : '再生中'}` : `${rpm === 45 ? '45 RPM' : '33⅓ RPM'} · 音源を選択してください`;
  }
  function setArmAngle(degrees, syncAudio = false) {
    armAngle = clamp(degrees, 0, MAX_SWEEP);
    tonearm.setAttribute('transform', `rotate(${armAngle.toFixed(3)} ${PIVOT.x} ${PIVOT.y})`);
    if (syncAudio && Number.isFinite(audio.duration) && audio.duration > 0) {
      try { audio.currentTime = (armAngle / MAX_SWEEP) * audio.duration; } catch (_) {}
    }
  }
  function angleFromProgress() {
    if (Number.isFinite(audio.duration) && audio.duration > 0) {
      setArmAngle((audio.currentTime / audio.duration) * MAX_SWEEP, false);
    }
  }
  function svgPointFromEvent(e) {
    const p = svg.createSVGPoint();
    p.x = e.clientX; p.y = e.clientY;
    return p.matrixTransform(svg.getScreenCTM().inverse());
  }
  function pointAngle(point) { return Math.atan2(point.y - PIVOT.y, point.x - PIVOT.x); }
  function angleDelta(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  tonearm.addEventListener('pointerdown', e => {
    if (e.button !== undefined && e.button !== 0) return;
    const pt = svgPointFromEvent(e);
    dragging = true;
    dragPointerAngle = pointAngle(pt);
    dragArmStart = armAngle;
    tonearm.classList.add('dragging');
    try { tonearm.setPointerCapture(e.pointerId); } catch (_) {}
    e.preventDefault();
  });
  tonearm.addEventListener('pointermove', e => {
    if (!dragging) return;
    const pt = svgPointFromEvent(e);
    const delta = angleDelta(pointAngle(pt), dragPointerAngle) * 180 / Math.PI;
    setArmAngle(dragArmStart + delta, true);
    e.preventDefault();
  });
  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    tonearm.classList.remove('dragging');
    if (e && e.pointerId !== undefined) { try { tonearm.releasePointerCapture(e.pointerId); } catch (_) {} }
    status.textContent = Number.isFinite(audio.duration) && audio.duration > 0
      ? `針位置 ${(armAngle / MAX_SWEEP * 100).toFixed(0)}% · ${rpm === 45 ? '45 RPM' : '33⅓ RPM'}`
      : '針を動かせます。音源を選択すると再生位置も連動します。';
  }
  tonearm.addEventListener('pointerup', endDrag);
  tonearm.addEventListener('pointercancel', endDrag);
  tonearm.addEventListener('lostpointercapture', () => { if (dragging) endDrag(); });

  function spinFrame(now) {
    if (!rotationFrame) return;
    if (!audio.paused && lastFrameTime) {
      const dt = Math.min(80, now - lastFrameTime);
      // Deliberately slow visual spin: 33⅓ takes 6 seconds/revolution; 45 remains proportionally faster.
      const period = rpm === 45 ? 4.444444 : 6.0;
      rotationAngle = (rotationAngle + dt / (period * 1000) * 360) % 360;
      record.setAttribute('transform', `rotate(${rotationAngle.toFixed(3)} 342 352)`);
    }
    lastFrameTime = now;
    if (!audio.paused) angleFromProgress();
    rotationFrame = requestAnimationFrame(spinFrame);
  }
  function setRunning(running) {
    playBtn.innerHTML = running
      ? '<span class="button-icon">Ⅱ</span><span>一時停止</span>'
      : '<span class="button-icon">▶</span><span>再生</span>';
    playBtn.setAttribute('aria-label', running ? '一時停止' : '再生');
    playBtn.setAttribute('aria-pressed', String(running));
    const led = $('powerLed');
    if (led) led.classList.toggle('on', running);
    status.textContent = running ? `${rpm === 45 ? '45 RPM' : '33⅓ RPM'} · LP再生中` : (audio.src ? '停止中' : '音源を選択してください');
    if (running && !rotationFrame) { lastFrameTime = 0; rotationFrame = requestAnimationFrame(spinFrame); }
    if (!running && rotationFrame) { cancelAnimationFrame(rotationFrame); rotationFrame = 0; lastFrameTime = 0; }
    if (noiseGain && audioContext) {
      const now = audioContext.currentTime;
      noiseGain.gain.cancelScheduledValues(now);
      noiseGain.gain.setTargetAtTime(running ? 0.0025 : 0, now, running ? .18 : .05);
    }
    if (running) scheduleCrackle();
    else if (crackleTimer) { clearTimeout(crackleTimer); crackleTimer = null; }
  }
  async function ensureAudioGraph() {
    if (audioContext) {
      if (audioContext.state === 'suspended') await audioContext.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      audioContext = new AC();
      audioSource = audioContext.createMediaElementSource(audio);
      const warmth = audioContext.createBiquadFilter();
      warmth.type = 'lowshelf'; warmth.frequency.value = 170; warmth.gain.value = 1.7;
      const soft = audioContext.createBiquadFilter();
      soft.type = 'lowpass'; soft.frequency.value = 14500; soft.Q.value = .55;
      const saturation = audioContext.createWaveShaper();
      const curve = new Float32Array(1024);
      for (let i=0;i<curve.length;i++){const x=(i*2)/(curve.length-1)-1;curve[i]=Math.tanh(1.08*x)/Math.tanh(1.08);}
      saturation.curve = curve; saturation.oversample = '2x';
      const master = audioContext.createGain(); master.gain.value = .94;
      audioSource.connect(warmth); warmth.connect(soft); soft.connect(saturation); saturation.connect(master); master.connect(audioContext.destination);
      const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 2, audioContext.sampleRate);
      const data = buffer.getChannelData(0); let last=0;
      for(let i=0;i<data.length;i++){last=last*.25+(Math.random()*2-1)*.75;data[i]=last;}
      noiseSource = audioContext.createBufferSource(); noiseSource.buffer=buffer; noiseSource.loop=true;
      const noiseFilter=audioContext.createBiquadFilter();noiseFilter.type='bandpass';noiseFilter.frequency.value=2400;noiseFilter.Q.value=.65;
      noiseGain=audioContext.createGain();noiseGain.gain.value=0;
      noiseSource.connect(noiseFilter);noiseFilter.connect(noiseGain);noiseGain.connect(master);noiseSource.start();
      crackleBuffer=audioContext.createBuffer(1,Math.ceil(audioContext.sampleRate*.015),audioContext.sampleRate);
      const cd=crackleBuffer.getChannelData(0);for(let i=0;i<cd.length;i++)cd[i]=(Math.random()*2-1)*Math.exp(-i/(cd.length*.15));
      await audioContext.resume();
    } catch (_) {
      // Unsupported audio processing falls back to native playback.
      if (audioContext && audioContext.state !== 'closed') { try { await audioContext.close(); } catch (_) {} }
      audioContext=null;audioSource=null;noiseGain=null;noiseSource=null;crackleBuffer=null;
    }
  }
  function popCrackle() {
    if (!audioContext || !crackleBuffer || audio.paused || !noiseGain) return;
    try {
      const src=audioContext.createBufferSource();src.buffer=crackleBuffer;
      const filter=audioContext.createBiquadFilter();filter.type='highpass';filter.frequency.value=1000;
      const gain=audioContext.createGain();gain.gain.value=.003+Math.random()*.003;
      src.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);src.start();src.stop(audioContext.currentTime+.018);
    } catch (_) {}
  }
  function scheduleCrackle() {
    if (crackleTimer) clearTimeout(crackleTimer);
    if (audio.paused) return;
    crackleTimer=setTimeout(()=>{if(!audio.paused){if(Math.random()<.55)popCrackle();scheduleCrackle();}},650+Math.random()*1500);
  }
  loadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => {
    const file=fileInput.files && fileInput.files[0]; if(!file)return;
    audio.pause();setRunning(false);
    if(fileUrl)URL.revokeObjectURL(fileUrl);
    fileUrl=URL.createObjectURL(file);audio.src=fileUrl;audio.load();
    trackName.textContent=file.name;trackName.title=file.name;
    const led = $('powerLed'); if (led) led.classList.add('on');
    try{audio.currentTime=0;}catch(_){}
    setArmAngle(0,false);status.textContent='音源を読み込みました。再生ボタンを押してください。';
    fileInput.value='';
  });
  playBtn.addEventListener('click', async () => {
    if (!audio.src) { status.textContent='先に音源を選択してください。';fileInput.click();return; }
    if (!audio.paused) { audio.pause();setRunning(false);return; }
    try { await ensureAudioGraph();applyRpm();await audio.play();setRunning(true); }
    catch (_) { status.textContent='再生できませんでした。MP3またはWAVをお試しください。'; }
  });
  stopBtn.addEventListener('click', () => {
    audio.pause();try{audio.currentTime=0;}catch(_){}
    setArmAngle(0,false);setRunning(false);
    status.textContent=audio.src?'停止しました。':'先に音源を選択してください。';
  });
  function chooseRpm(v){rpm=v;applyRpm();}
  rpm33.addEventListener('click',()=>chooseRpm(33));
  rpm45.addEventListener('click',()=>chooseRpm(45));
  audio.addEventListener('timeupdate',()=>{if(!dragging)angleFromProgress();});
  audio.addEventListener('loadedmetadata',()=>{if(!dragging)angleFromProgress();});
  audio.addEventListener('seeked',()=>{if(!dragging)angleFromProgress();});
  audio.addEventListener('play',()=>setRunning(true));
  audio.addEventListener('pause',()=>setRunning(false));
  audio.addEventListener('ended',()=>{setRunning(false);setArmAngle(MAX_SWEEP,false);status.textContent='再生が終了しました。';});
  audio.addEventListener('error',()=>{if(audio.src){setRunning(false);status.textContent='この音源を再生できません。MP3またはWAVをお試しください。';}});
  window.addEventListener('beforeunload',()=>{if(fileUrl)URL.revokeObjectURL(fileUrl);if(crackleTimer)clearTimeout(crackleTimer);if(rotationFrame)cancelAnimationFrame(rotationFrame);if(audioContext&&audioContext.state!=='closed')audioContext.close();});
  setArmAngle(0,false);applyRpm();
})();
