<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>デジタル時計byFoZoWo</title>
<style>
*{box-sizing:border-box;margin:0}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100svh;background:#000;color:#fff;font-family:sans-serif}
@media(prefers-color-scheme:light){body{background:#fff;color:#000}}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:14px}
h1{font-size:inherit;font-weight:600}
a{color:inherit;text-decoration:none;padding:4px 8px;border:1px solid currentColor;border-radius:6px}
main{flex:1;display:grid;place-items:center}
#t{font-size:clamp(3rem,18vw,16rem);font-weight:700;font-variant-numeric:tabular-nums}
</style>
<header>
  <h1>デジタル時計byFoZoWo</h1>
  <a href="https://tool.fozowo.com/index.html">ツール一覧</a>
</header>
<main><time id="t">--:--:--</time></main>
<script>
let e=document.getElementById("t"),
    p=n=>(n<10?"0":"")+n,
    w=()=>{let d=new Date();e.textContent=p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds())};
w();setInterval(w,1000);
</script>
