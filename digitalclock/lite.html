<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>デジタル時計byFoZoWo</title>
<style>
*{box-sizing:border-box;margin:0}
body{display:flex;flex-direction:column;min-height:100vh;min-height:100svh;font-family:system-ui,sans-serif;color-scheme:light dark}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:14px}
h1{font-size:inherit;font-weight:600}
a{color:inherit;text-decoration:none;padding:6px 10px;border:1px solid #8884;border-radius:8px}
main{flex:1;display:grid;place-items:center;padding:8px}
#time{font-size:clamp(2.8rem,18vw,15rem);font-weight:600;font-variant-numeric:tabular-nums}
</style>
<header>
  <h1>デジタル時計byFoZoWo</h1>
  <a href="https://tool.fozowo.com/lite/">ツール一覧</a>
</header>
<main>
  <time id="time">--:--:--</time>
</main>
<script>
let d = document.getElementById("time"),
    f = n => String(n).padStart(2, "0"),
    u = () => {
      let t = new Date();
      d.dateTime = t.toISOString();
      d.textContent = `${f(t.getHours())}:${f(t.getMinutes())}:${f(t.getSeconds())}`;
    };
u(); setInterval(u, 1000);
</script>
